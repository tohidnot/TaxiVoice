<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaxiVoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=16" />
</head>
<body>
  <div id="app" class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark">
          <svg class="brand-mic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#111" d="M12 14a3.2 3.2 0 0 0 3.2-3.2V6.2A3.2 3.2 0 0 0 12 3 3.2 3.2 0 0 0 8.8 6.2v4.6A3.2 3.2 0 0 0 12 14Z"/>
            <path fill="#111" d="M18 10.8a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.92V19H9.2a1 1 0 1 0 0 2h5.6a1 1 0 1 0 0-2H13v-2.28A6 6 0 0 0 18 10.8Z"/>
          </svg>
          <span class="brand-name">TaxiVoice</span>
        </span>
        <div class="brand-actions">
          <button type="button" id="btn-history" class="icon-btn" title="History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7"/>
              <path d="M3 4v5h5"/>
              <path d="M12 7v5l3 2"/>
            </svg>
          </button>
          <button type="button" id="btn-new" class="icon-btn" title="New workspace">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="4" y="4" width="16" height="16" rx="4"/>
              <path d="M12 8v8M8 12h8"/>
            </svg>
          </button>
          <button type="button" id="btn-collapse" class="icon-btn collapse-btn" title="Collapse chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/>
              <path d="M9 4.5v15"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="history-pane" class="history-pane" hidden>
        <div class="history-head">
          <span>Workspaces</span>
          <button type="button" id="btn-history-new" class="history-new">New</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>

      <div id="chat" class="chat"></div>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="How can I help you today?"></textarea>
        <div class="composer-tools">
          <button type="button" class="attach-btn" id="btn-import" title="Attach audio or video">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <span class="model-hint">Parakeet v3</span>
          <button type="submit" id="btn-send" class="send-circle" title="Send" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
          </button>
        </div>
      </form>
    </aside>
    <div id="resizer" class="resizer" role="separator" aria-orientation="vertical" title="Drag to resize chat"></div>

    <main class="main">
      <header class="topbar">
        <button type="button" id="btn-expand" class="icon-btn expand-chat" hidden title="Open chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/>
            <path d="M9 4.5v15"/>
          </svg>
        </button>
        <div class="top-left editor-only" hidden>
          <button id="project-name" class="project-name">Untitled</button>
          <div class="history">
            <button id="btn-undo" class="icon-btn" title="Undo" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/></svg>
            </button>
            <button id="btn-redo" class="icon-btn" title="Redo" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h4"/></svg>
            </button>
          </div>
        </div>
        <div class="top-right">
          <button id="btn-share" class="text-btn editor-only" hidden>Share</button>
          <button id="btn-export" class="export-btn editor-only" hidden>Export</button>
        </div>
      </header>

      <section class="stage empty" id="stage">
        <div id="dropzone" class="dropzone">
          <div class="drop-icon" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M12 16V4M7 8l5-5 5 5"/>
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
          </div>
          <h2>Upload audio or video</h2>
          <p>Drop an MP3, WAV, M4A, MP4, or MOV here. We transcribe it into words you can delete.</p>
          <button type="button" id="btn-upload-main" class="upload-btn solid">Choose file</button>
        </div>
        <div id="loading" class="loading" hidden>
          <div class="spinner"></div>
          <h2>Transcribing with Parakeet v3</h2>
          <p id="loading-name">This can take a few seconds on the first run.</p>
        </div>
        <div class="stage-row" id="stage-row" hidden>
          <div class="words-wrap">
            <button id="btn-play-inline" class="chip-play" title="Play from start">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div id="words" class="words"></div>
          </div>
          <aside id="video-pane" class="video-pane" hidden>
            <div class="video-frame">
              <video id="video" playsinline></video>
              <div id="caption" class="caption"></div>
              <div class="video-chrome">
                <button type="button" class="mini-play" id="btn-video-play">▶</button>
                <span id="video-time">0:00 / 0:00</span>
                <span class="chrome-right">CC</span>
              </div>
            </div>
          </aside>
        </div>
      </section>

      <footer class="transport editor-only" hidden>
        <div class="transport-controls">
          <button class="icon-btn" title="Fit" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </button>
          <div class="play-cluster">
            <button id="btn-back" class="icon-btn" title="Back 3s" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 12h13M9 5.5 2.5 12 9 18.5"/><path d="M20 5v14"/></svg>
            </button>
            <button id="btn-play" class="play-btn" title="Play" type="button">
              <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
            <button id="btn-fwd" class="icon-btn" title="Forward 3s" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 12h13M16 5.5 22.5 12 16 18.5"/><path d="M4 5v14"/></svg>
            </button>
          </div>
          <span></span>
        </div>
        <div class="ruler" id="ruler"></div>
        <div id="wave-wrap" class="wave-wrap">
          <canvas id="wave"></canvas>
          <div id="playhead" class="playhead" hidden></div>
        </div>
        <div id="filmstrip-wrap" class="filmstrip-wrap" hidden>
          <div id="film-playhead" class="film-playhead"></div>
          <div id="filmstrip" class="filmstrip"></div>
        </div>
      </footer>
    </main>
  </div>

  <input id="file" type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.mp4,.mov,.mkv" hidden />
  <audio id="audio" preload="auto"></audio>
  <script src="app.js?v=16"></script>
</body>
</html>
